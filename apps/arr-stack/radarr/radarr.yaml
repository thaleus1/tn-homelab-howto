apiVersion: v1
kind: Namespace
metadata:
  name: radarr
  labels:
    name: radarr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: radarr
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7878
              name: http
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /downloads
              name: downloads
            - mountPath: /media/movies
              name: movies
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads-pvc
        - name: movies
          persistentVolumeClaim:
            claimName: media-movies-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: radarr-web
  namespace: radarr
spec:
  ports:
    - name: http
      port: 7878
      targetPort: 7878
  selector:
    app: radarr
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  namespace: radarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`radarr.yourdomain.com`) && PathPrefix(`/api`)
      priority: 20
      services:
        - name: radarr-web
          port: 7878
    - kind: Rule
      match: Host(`radarr.yourdomain.com`)
      priority: 10
      middlewares:
        - name: authentik-authentik@kubernetescrd
      services:
        - name: radarr-web
          port: 7878
  tls:
    secretName: wildcard-tls
