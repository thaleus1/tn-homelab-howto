apiVersion: v1
kind: Namespace
metadata:
  name: bazarr
  labels:
    name: bazarr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: bazarr
  labels:
    app: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6767
              name: http
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media/movies
              name: movies
            - mountPath: /media/tvshows
              name: tvshows
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: movies
          persistentVolumeClaim:
            claimName: media-movies-pvc
        - name: tvshows
          persistentVolumeClaim:
            claimName: media-tvshows-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr-web
  namespace: bazarr
spec:
  ports:
    - name: http
      port: 6767
      targetPort: 6767
  selector:
    app: bazarr
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bazarr
  namespace: bazarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`bazarr.yourdomain.com`) && PathPrefix(`/api`)
      priority: 20
      services:
        - name: bazarr-web
          port: 6767
    - kind: Rule
      match: Host(`bazarr.yourdomain.com`)
      priority: 10
      middlewares:
        - name: authentik-authentik@kubernetescrd
      services:
        - name: bazarr-web
          port: 6767
  tls:
    secretName: wildcard-tls
