apiVersion: v1
kind: Namespace
metadata:
  name: cleanuparr
  labels:
    name: cleanuparr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr
  namespace: cleanuparr
  labels:
    app: cleanuparr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cleanuparr
  template:
    metadata:
      labels:
        app: cleanuparr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      containers:
        - name: cleanuparr
          image: ghcr.io/cleanuparr/cleanuparr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: TZ
              value: America/New_York
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /config
              name: config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cleanuparr-config
---
apiVersion: v1
kind: Service
metadata:
  name: cleanuparr-web
  namespace: cleanuparr
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  selector:
    app: cleanuparr
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cleanuparr
  namespace: cleanuparr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cleanuparr.yourdomain.com`)
      priority: 10
      middlewares:
        - name: authentik-authentik@kubernetescrd
      services:
        - name: cleanuparr-web
          port: 5000
  tls:
    secretName: wildcard-tls
