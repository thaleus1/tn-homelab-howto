apiVersion: v1
kind: Namespace
metadata:
  name: sabnzbd
  labels:
    name: sabnzbd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: sabnzbd
  labels:
    app: sabnzbd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      containers:
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /downloads
              name: downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd-web
  namespace: sabnzbd
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: sabnzbd
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sabnzbd
  namespace: sabnzbd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`sabnzbd.yourdomain.com`) && PathPrefix(`/api`)
      priority: 20
      services:
        - name: sabnzbd-web
          port: 8080
    - kind: Rule
      match: Host(`sabnzbd.yourdomain.com`)
      priority: 10
      middlewares:
        - name: authentik-authentik@kubernetescrd
      services:
        - name: sabnzbd-web
          port: 8080
  tls:
    secretName: wildcard-tls
