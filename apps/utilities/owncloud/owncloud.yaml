apiVersion: v1
kind: Namespace
metadata:
  name: owncloud
  labels:
    name: owncloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owncloud
  namespace: owncloud
  labels:
    app: owncloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: owncloud
  template:
    metadata:
      labels:
        app: owncloud
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      containers:
        - name: owncloud
          image: owncloud/server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OWNCLOUD_DOMAIN
              value: "files.yourdomain.com"
            - name: OWNCLOUD_DB_TYPE
              value: "mysql"
            - name: OWNCLOUD_DB_NAME
              value: "owncloud"
            - name: OWNCLOUD_DB_USERNAME
              value: "owncloud"
            - name: OWNCLOUD_DB_HOST
              value: "owncloud-mariadb"
            - name: OWNCLOUD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: owncloud-secrets
                  key: OWNCLOUD_DB_PASSWORD
            - name: OWNCLOUD_ADMIN_USERNAME
              value: "admin"
            - name: OWNCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: owncloud-secrets
                  key: OWNCLOUD_ADMIN_PASSWORD
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - mountPath: /mnt/data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: owncloud-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: owncloud-web
  namespace: owncloud
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: owncloud
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: owncloud
  namespace: owncloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`files.yourdomain.com`)
      kind: Rule
      services:
        - name: owncloud-web
          port: 8080
  tls:
    secretName: wildcard-tls
