apiVersion: v1
kind: Namespace
metadata:
  name: onlyoffice
  labels:
    name: onlyoffice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: onlyoffice
  labels:
    app: onlyoffice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      containers:
        - name: onlyoffice
          image: onlyoffice/documentserver:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onlyoffice-secret
                  key: jwt-secret
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - mountPath: /var/www/onlyoffice/Data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onlyoffice-data
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: onlyoffice
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: onlyoffice
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onlyoffice
  namespace: onlyoffice
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`office.yourdomain.com`)
      kind: Rule
      services:
        - name: onlyoffice
          port: 80
  tls:
    secretName: wildcard-tls
