apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
  labels:
    name: gitlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:17.5.1-ce.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'https://gitlab.yourdomain.com'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                gitlab_rails['time_zone'] = 'America/New_York'
                # Disable bundled monitoring to conserve homelab RAM
                prometheus_monitoring['enable'] = false
                prometheus['enable'] = false
                alertmanager['enable'] = false
                node_exporter['enable'] = false
                redis_exporter['enable'] = false
                postgres_exporter['enable'] = false
                gitlab_exporter['enable'] = false
                puma['worker_processes'] = 2
                puma['min_threads'] = 4
                puma['max_threads'] = 4
          ports:
            - containerPort: 80
              name: http
            - containerPort: 22
              name: ssh
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          volumeMounts:
            - mountPath: /var/opt/gitlab
              name: data
            - mountPath: /etc/gitlab
              name: config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data-pvc
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-web
  namespace: gitlab
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: gitlab
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gitlab.yourdomain.com`)
      kind: Rule
      services:
        - name: gitlab-web
          port: 80
  tls:
    secretName: wildcard-tls
