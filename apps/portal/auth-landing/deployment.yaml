apiVersion: v1
kind: Namespace
metadata:
  name: auth-landing
  labels:
    name: auth-landing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-landing
  namespace: auth-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-landing
  template:
    metadata:
      labels:
        app: auth-landing
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: auth-landing-html
---
apiVersion: v1
kind: Service
metadata:
  name: auth-landing
  namespace: auth-landing
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: auth-landing
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-landing
  namespace: auth-landing
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`portal.yourdomain.com`)
      kind: Rule
      services:
        - name: auth-landing
          port: 80
  tls:
    secretName: wildcard-tls
