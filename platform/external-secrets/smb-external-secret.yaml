apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smbcreds
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: smbcreds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "smb-username"
    - secretKey: password
      remoteRef:
        key: "smb-password"
