apiVersion: v1
kind: Namespace
metadata:
  name: kured
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kured
  namespace: kured
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kured
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs:     ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs:     ["list", "delete", "get"]
- apiGroups: ["extensions", "apps"]
  resources: ["daemonsets"]
  verbs:     ["get"]
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs:     ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kured
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kured
subjects:
- kind: ServiceAccount
  name: kured
  namespace: kured
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: kured
  name: kured
rules:
  - apiGroups:     ["extensions", "apps"]
    resources:     ["daemonsets"]
    resourceNames: ["kured"]
    verbs:         ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: kured
  name: kured
subjects:
- kind: ServiceAccount
  namespace: kured
  name: kured
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kured
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kured
  namespace: kured
  labels:
    app.kubernetes.io/name: kured
spec:
  revisionHistoryLimit: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kured
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kured
    spec:
      serviceAccountName: kured
      hostNetwork: false
      hostPID: true
      restartPolicy: Always
      containers:
        - name: kured
          image: ghcr.io/kubereboot/kured:1.23.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          command:
            - /usr/bin/kured
          args:
            - --ds-name=kured
            - --ds-namespace=kured
            - --period=15m
            - --drain-timeout=10m
            - --skip-wait-for-delete-timeout=60
            - --reboot-sentinel=/sentinel/reboot-required
            - --reboot-command=/bin/systemctl reboot
            - --annotate-nodes=true
            - --log-format=text
            - --concurrency=1
            - --lock-release-delay=2m
            - --lock-ttl=30m
            - --prefer-no-schedule-taint=weave.works/kured-node-reboot
            - --start-time=02:00
            - --end-time=05:00
            - --time-zone=America/New_York
          volumeMounts:
            - mountPath: /sentinel
              name: sentinel
              readOnly: true
          ports:
            - containerPort: 8080
              name: metrics
          env:
            - name: KURED_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
        - name: sentinel
          hostPath:
            path: /var/run
            type: Directory
